---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/sharkgym
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/rm -rf "$DEPLOYPATH/assets"
    - /bin/rm -f "$DEPLOYPATH/index.html" "$DEPLOYPATH/404.html" "$DEPLOYPATH/robots.txt" "$DEPLOYPATH/.htaccess"
    - /bin/find "$DEPLOYPATH" -maxdepth 1 -type f \( -name "*.css" -o -name "*.js" -o -name "*.map" \) -delete
    - /bin/cp -a dist/. "$DEPLOYPATH"/
