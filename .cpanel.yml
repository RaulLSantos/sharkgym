---
deployment:
  tasks:
    - /bin/sh -c 'DEPLOYPATH="$HOME/public_html/sharkgym"; case "$DEPLOYPATH" in "$HOME"/public_html/sharkgym) /bin/mkdir -p "$DEPLOYPATH" && /bin/find "$DEPLOYPATH" -mindepth 1 -maxdepth 1 -exec /bin/rm -rf {} \; && /bin/cp -a dist/. "$DEPLOYPATH"/ ;; *) echo "Unsafe deploy path: $DEPLOYPATH"; exit 1 ;; esac'
